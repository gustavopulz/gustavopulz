name: Metrics

on:
  schedule:
    - cron: '0 6 * * 1'
  workflow_dispatch:
  push:
    branches: [master]
    paths: ['.github/workflows/metrics.yml', '.github/scripts/languages.mjs']

permissions:
  contents: write

concurrency:
  group: metrics
  cancel-in-progress: true

jobs:
  metrics:
    runs-on: ubuntu-latest
    steps:
      - name: Estatísticas
        uses: lowlighter/metrics@latest
        with:
          token: ${{ secrets.METRICS_TOKEN }}
          user: gustavopulz
          filename: metrics-stats.svg
          committer_message: 'chore: update metrics'
          base: header, activity, community, repositories
          base_indepth: yes
          repositories_affiliations: owner, collaborator, organization_member
          config_timezone: America/Sao_Paulo
          config_display: large
          config_order: base.header, base.activity, base.community, base.repositories

      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Linguagens
        env:
          GH_TOKEN: ${{ secrets.METRICS_TOKEN }}
        run: node .github/scripts/languages.mjs

      - name: Commit
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          sed -i -E "s#(metrics-(stats|languages)\.svg)(\?v=[0-9]+)?#\1?v=$(date +%s)#g" README.md
          git add metrics-languages.svg README.md
          git diff --cached --quiet || git commit -m 'chore: update metrics' && git push
